name: CI

on:
  push:
  pull_request:

jobs:
  repository-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify expected files exist
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          test -f docs/architecture.md
          test -f docs/ai-inference-impact.md
          test -f docs/kernel-patch-notes.md
          test -f docs/pcie-to-tlb-thesis.md
          test -f docs/x86-64-tlb-assembly.md
          test -f docs/arm64-tlb-assembly.md
          test -f docs/boot-and-arch-notes.md
          test -f docs/correlation-and-visualization.md
          test -f docs/results.md
          test -f examples/sample_trace.txt
          test -f examples/sample_trace.csv
          test -f examples/sample_trace_summary.txt
          test -f examples/sample_health_score.txt
          test -f examples/tlb_timeseries.csv
          test -f examples/latency_timeseries.csv
          test -f examples/gpu_timeseries.csv
          test -f examples/sched_timeseries.csv
          test -f examples/correlation.csv
          test -f examples/plots/README.md
          test -f patches/0001-x86-mm-add-tlb-invalidation-tracepoint.patch
          test -f patches/0002-mm-add-mmu-notifier-invalidation-tracepoint.patch
          test -f patches/0003-proc-add-per-process-tlb-stats-sketch.patch
          test -f patches/0004-x86-mm-expose-broadcast-invalidation-capability.patch
          test -f patches/0005-x86-mm-add-arch-invalidation-probe-hooks.patch
          test -f patches/0006-arm64-mm-add-arch-invalidation-probe-hooks.patch
          test -f arch-probes/README.md
          test -f arch-probes/x86_64/invlpg_probe.h
          test -f arch-probes/x86_64/invpcid_probe.h
          test -f arch-probes/x86_64/tlb_probe_module.c
          test -f arch-probes/x86_64/Makefile
          test -f arch-probes/arm64/tlbi_probe.h
          test -f arch-probes/arm64/tlb_probe_module.c
          test -f arch-probes/arm64/Makefile
          test -f benchmarks/Makefile
          test -f benchmarks/mmap_churn.c
          test -f benchmarks/mprotect_churn.c
          test -f benchmarks/threaded_mmap_churn.c
          test -f benchmarks/run_bench.sh
          test -f tools/collect_trace.sh
          test -f tools/correlate_latency.py
          test -f tools/parse_trace.py
          test -f tools/plot_correlation.py
          test -f tools/tlb_health_score.py
          test -f tools/prometheus_exporter.py
          test -f tools/sample_gpu.py
          test -f tools/sample_sched.py
          test -f run_experiment.sh
          test -f vm/run_qemu.sh
          test -f vm/README.md

  userspace-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install plotting dependency
        run: python -m pip install matplotlib

      - name: Python syntax checks
        run: python -m py_compile tools/parse_trace.py tools/tlb_health_score.py tools/prometheus_exporter.py tools/correlate_latency.py tools/sample_gpu.py tools/sample_sched.py tools/plot_correlation.py

      - name: Python smoke checks
        run: |
          python tools/parse_trace.py does-not-exist.txt --csv /tmp/missing.csv >/tmp/missing_stdout.csv
          test -f /tmp/missing.csv
          python tools/tlb_health_score.py does-not-exist.csv --window-seconds 10 >/tmp/missing_health.txt
          python tools/sample_gpu.py --duration 1 --interval 0.1 --output /tmp/gpu.csv
          test -f /tmp/gpu.csv
          python tools/sample_sched.py --duration 1 --interval 0.5 --output /tmp/sched.csv
          test -f /tmp/sched.csv

      - name: Parse sample trace
        run: |
          python tools/parse_trace.py examples/sample_trace.txt --csv /tmp/sample_trace.csv >/tmp/parse_stdout.csv
          python tools/tlb_health_score.py /tmp/sample_trace.csv --window-seconds 10 >/tmp/health.txt

      - name: Run correlation tool on examples
        run: |
          python tools/correlate_latency.py --tlb examples/tlb_timeseries.csv --latency examples/latency_timeseries.csv --gpu examples/gpu_timeseries.csv --sched examples/sched_timeseries.csv --output /tmp/correlation.csv >/tmp/correlation_summary.txt
          test -f /tmp/correlation.csv

      - name: Generate plots from examples
        run: |
          python tools/plot_correlation.py --input examples/correlation.csv --output-dir /tmp/plots
          test -f /tmp/plots/tlb_invalidations_vs_p99.png
          test -f /tmp/plots/bytes_invalidated_vs_p99.png
          test -f /tmp/plots/gpu_util_vs_tlb_invalidations.png
          test -f /tmp/plots/scheduler_pressure_vs_tlb_invalidations.png

      - name: Exporter survives missing input
        run: |
          timeout 5s python tools/prometheus_exporter.py --input does-not-exist.csv --listen 127.0.0.1 --port 9824 --refresh-seconds 1 >/tmp/exporter.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:9824/metrics | tee /tmp/exporter_metrics.txt
          grep -q "tlb_exporter_error" /tmp/exporter_metrics.txt

      - name: Shell syntax checks
        run: |
          bash -n vm/run_qemu.sh
          bash -n run_experiment.sh

      - name: Build benchmarks
        run: make -C benchmarks
