name: CI

on:
  push:
  pull_request:

jobs:
  repository-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify expected files exist
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          test -f docs/architecture.md
          test -f docs/ai-inference-impact.md
          test -f docs/kernel-patch-notes.md
          test -f docs/pcie-to-tlb-thesis.md
          test -f docs/x86-64-tlb-assembly.md
          test -f docs/arm64-tlb-assembly.md
          test -f docs/boot-and-arch-notes.md
          test -f docs/results.md
          test -f examples/sample_trace.txt
          test -f examples/sample_trace.csv
          test -f examples/sample_trace_summary.txt
          test -f examples/sample_health_score.txt
          test -f patches/0001-x86-mm-add-tlb-invalidation-tracepoint.patch
          test -f patches/0002-mm-add-mmu-notifier-invalidation-tracepoint.patch
          test -f patches/0003-proc-add-per-process-tlb-stats-sketch.patch
          test -f patches/0004-x86-mm-expose-broadcast-invalidation-capability.patch
          test -f patches/0005-x86-mm-add-arch-invalidation-probe-hooks.patch
          test -f patches/0006-arm64-mm-add-arch-invalidation-probe-hooks.patch
          test -f arch-probes/README.md
          test -f arch-probes/x86_64/invlpg_probe.h
          test -f arch-probes/x86_64/invpcid_probe.h
          test -f arch-probes/x86_64/tlb_probe_module.c
          test -f arch-probes/x86_64/Makefile
          test -f arch-probes/arm64/tlbi_probe.h
          test -f arch-probes/arm64/tlb_probe_module.c
          test -f arch-probes/arm64/Makefile
          test -f benchmarks/Makefile
          test -f benchmarks/mmap_churn.c
          test -f benchmarks/mprotect_churn.c
          test -f benchmarks/threaded_mmap_churn.c
          test -f benchmarks/run_bench.sh
          test -f tools/collect_trace.sh
          test -f tools/parse_trace.py
          test -f tools/tlb_health_score.py
          test -f tools/prometheus_exporter.py

  userspace-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax checks
        run: python -m py_compile tools/parse_trace.py tools/tlb_health_score.py tools/prometheus_exporter.py

      - name: Python smoke checks
        run: |
          python tools/parse_trace.py does-not-exist.txt --csv /tmp/missing.csv >/tmp/missing_stdout.csv
          test -f /tmp/missing.csv
          python tools/tlb_health_score.py does-not-exist.csv --window-seconds 10 >/tmp/missing_health.txt

      - name: Parse sample trace
        run: |
          python tools/parse_trace.py examples/sample_trace.txt --csv /tmp/sample_trace.csv >/tmp/parse_stdout.csv
          python tools/tlb_health_score.py /tmp/sample_trace.csv --window-seconds 10 >/tmp/health.txt

      - name: Build benchmarks
        run: make -C benchmarks
